###############################################################################
# DISPLAY - BASE
###############################################################################
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

###############################################################################
# POWER MANAGEMENT
# SLEEP: enable deep sleep
# IDLE_TIMEOUT: time before screen blanks (30s)
# IDLE_SLEEP_TIMEOUT: time before deep sleep (15m)
###############################################################################
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

###############################################################################
# BATTERY & SYSTEM
# BATTERY_REPORTING: ensure peripherals (right half) report battery level
# KEYBOARD_NAME: custom name for your bluetooth list (max 16 chars)
###############################################################################
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_KEYBOARD_NAME="Anthony's Corne"

###############################################################################
# ZMK STUDIO
###############################################################################
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_KEYMAP_LAYER_NAME_MAX_LEN=20

###############################################################################
# DISPLAY - NICE VIEW GEM
# ANIMATION: the gem sparkle on the right/peripheral side
# ANIMATION_MS: delay between frames — lower = faster sparkle
#   960  = ~60fps (fast)
#   2000 = slow, subtle
#   9600 = very slow
# WPM_FIXED_RANGE: cap the WPM graph scale to a fixed max
# WPM_FIXED_RANGE_MAX: the max WPM shown on the graph
###############################################################################
CONFIG_NICE_VIEW_GEM_ANIMATION=y
CONFIG_NICE_VIEW_GEM_ANIMATION_MS=1920
CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE=y
CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE_MAX=100
