###############################################################################
# DISPLAY - BASE
###############################################################################
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

###############################################################################
# NICE-VIEW-ELEMENTAL
# Layer name shown large, bold, all caps - easy to read at a glance
# ANIMATION: noisy background that fades toward screen edges
# SHADOW: 4px black outline around layer name for contrast
# OUTLINE: 1px white outline around shadow for extra pop
# Increase ANIMATION_FRAME_MS to slow animation (250=default, 0=disable)
###############################################################################
CONFIG_NICE_VIEW_ELEMENTAL_ANIMATION=y
CONFIG_NICE_VIEW_ELEMENTAL_ANIMATION_FRAME_MS=250
CONFIG_NICE_VIEW_ELEMENTAL_BACKGROUND=y
CONFIG_NICE_VIEW_ELEMENTAL_SHADOW=y
CONFIG_NICE_VIEW_ELEMENTAL_OUTLINE=y

###############################################################################
# ZMK STUDIO
###############################################################################
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
