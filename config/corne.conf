###############################################################################
# DISPLAY - BASE
###############################################################################
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_FULL_SCREEN_UPDATE=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

###############################################################################
# NICE-OLED - GENERAL
# Swap INVERTED=y for black bg white text
###############################################################################
CONFIG_NICE_EPAPER_ON=y
CONFIG_NICE_OLED_WIDGET_OUTPUT_BACKGROUND=y
# CONFIG_NICE_OLED_WIDGET_INVERTED=y

###############################################################################
# CENTRAL - WPM + BONGO CAT
# Swap to LUNA=y + BONGO_CAT=n to use Luna dog instead
# Raise WPM_FIXED_RANGE_MAX as your speed improves
###############################################################################
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=y
CONFIG_NICE_OLED_GRAPH_AND_NEEDLE_WPM_FIXED_RANGE=y
CONFIG_NICE_OLED_GRAPH_AND_NEEDLE_WPM_FIXED_RANGE_MAX=100

###############################################################################
# CENTRAL - MODIFIERS (Shift/Ctrl/Alt/GUI)
# Useful for learning layout - lights up active modifiers
# Luna disabled as Bongo Cat has no modifiers variant
# Re-enable LUNA=y if switching back to Luna dog
###############################################################################
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n

###############################################################################
# CENTRAL - HID INDICATORS (CapsLock/NumLock/ScrollLock)
# Disabled - CapsLock is remapped to Hyper
# To re-enable: set =y, add LUNA=y and LUNA_ONLY_CAPSLOCK=y below
###############################################################################
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n

###############################################################################
# CENTRAL - SLEEP ART
# Uncomment to show custom artwork on idle or sleep
###############################################################################
# CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
# CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y

###############################################################################
# PERIPHERAL - RIGHT SIDE ANIMATION
# Pick ONE - comment out CAT and uncomment another to switch
# Options: GEM (subtle sparkle), HEAD (bobbing), POKEMON, SPACEMAN,
#          SMART_BATTERY (battery themed), WPM (experimental)
###############################################################################
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_WPM=y

###############################################################################
# PERIPHERAL - STATIC IMAGE
# Uncomment to show a static logo/image instead of animation
###############################################################################
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y

###############################################################################
# RAW HID
# Requires qmk-hid-host companion app running on host PC over USB
# TIME, VOLUME, LAYOUT work on Windows/Linux/macOS
# WEATHER and SPOTIFY are macOS only
# Edit LAYOUT_LIST to match your OS input sources
###############################################################################
CONFIG_NICE_OLED_WIDGET_RAW_HID=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_TIME=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_VOLUME=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_LAYOUT=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_LAYOUT_LIST="EN,KR,JP"
# CONFIG_NICE_OLED_WIDGET_RAW_HID_WEATHER=y
# CONFIG_NICE_OLED_WIDGET_RAW_HID_MEDIA_PLAYER_SPOTIFY_MACOS=y

###############################################################################
# ZMK STUDIO
###############################################################################
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
