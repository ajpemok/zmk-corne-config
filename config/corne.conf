###############################################################################
# DISPLAY - BASE
###############################################################################
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

###############################################################################
# DISPLAY - NICE VIEW GEM
# ANIMATION: the gem sparkle on the right/peripheral side
# ANIMATION_MS: delay between frames — lower = faster sparkle
#   960  = ~60fps (fast)
#   2000 = slow, subtle
#   9600 = very slow
# WPM_FIXED_RANGE: cap the WPM graph scale to a fixed max
# WPM_FIXED_RANGE_MAX: the max WPM shown on the graph
###############################################################################
CONFIG_NICE_VIEW_GEM_ANIMATION=y
CONFIG_NICE_VIEW_GEM_ANIMATION_MS=960
CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE=y
CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE_MAX=100

###############################################################################
# ZMK STUDIO
###############################################################################
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
